<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>种花计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌸 种花计算器</h1>

        <!-- 种植时间 -->
        <div class="card">
            <label for="plantTime">🌱 种植时间：</label>
            <input type="datetime-local" id="plantTime">
            <button class="calc-btn" onclick="calculate()">⏳ 计算收获时间</button>
        </div>

        <!-- 收获时间 -->
        <div class="card">
            <p>📅 收获时间：<span id="harvestTime">--</span></p>
        </div>

        <!-- 倒计时 -->
        <div class="card">
            <p>⏱️ 倒计时：<span id="countdown">--</span></p>
        </div>

        <!-- 提示 -->
        <div class="tip">
            💡 提示：选择种植时间后点击计算，即可查看收获时间和倒计时。
        </div>

        <!-- 版权信息 -->
        <div class="footer-info">
            <p>📕 作者：6A6C9B30</p>
            <p>© 相关IP知识产权属于游戏原公司</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
